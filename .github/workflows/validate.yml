name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: python -m pip install pypdf==6.10.0
      - run: npm install --global pnpm@10
      - run: node tools/fetch-renderer.mjs
      - run: node tools/fetch-font.mjs
      - name: Shared local and remote validation
        env:
          ARCHITECTURE_PLANTUML_JAR: ${{ github.workspace }}/.tmp/renderers/plantuml.jar
          ARCHITECTURE_FONT: ${{ github.workspace }}/.tmp/renderers/NotoSansSC.ttf
          ARCHITECTURE_PYTHON: python
        run: npm run validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: test/1.1.0/evidence/
